<html lang="zh-CN" data-theme="dark">

  <title>DeepSeek Harness · Experts</title>
  <style>

    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{color:var(--text);background:var(--ink);font-family:var(--read);-webkit-font-smoothing:antialiased}button,input,textarea,select{color:inherit;font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--acid);outline-offset:2px}
    .scene{position:fixed;inset:0;overflow:hidden;background:#090b11;z-index:0}.scene::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(4,6,10,.76),rgba(4,6,10,.95)),url('../../ui-knowledge/src/client/assets/punk-collage-dark.png');background-size:cover;background-position:center;filter:saturate(.88) contrast(1.02);transform:scale(1.015)}.scene::after{content:'';position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:radial-gradient(circle at 10% 20%,var(--acid) 0 1px,transparent 1.5px),radial-gradient(circle at 70% 60%,white 0 1px,transparent 1.6px);background-size:13px 13px,17px 17px;mix-blend-mode:overlay}.scene-texture{position:absolute;inset:0;z-index:2;opacity:.04;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.14) 3px 4px)}.scene-shard{position:absolute;z-index:2;pointer-events:none}.shard-a{width:420px;height:80px;top:5%;right:3%;transform:rotate(-4deg);background:var(--blue);clip-path:polygon(0 33%,88% 0,100% 56%,8% 100%);opacity:.28}.shard-b{width:300px;height:70px;bottom:4%;left:7%;transform:rotate(3deg);background:var(--pink);clip-path:polygon(5% 0,100% 22%,91% 100%,0 71%);opacity:.22}.scene-scribble{position:absolute;right:4%;bottom:3%;z-index:3;color:rgba(255,255,255,.45);font:900 11px var(--mono);letter-spacing:.14em;transform:rotate(-2deg)}
    .product-shell{position:relative;z-index:5;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);width:100%;height:100%}.global-rail{position:relative;display:flex;flex-direction:column;min-width:0;padding:52px 12px 16px;color:var(--paper);background:rgba(7,9,13,.94);border-right:3px solid var(--ink);box-shadow:8px 0 0 rgba(36,57,255,.52);isolation:isolate}.global-rail::before{content:'';position:absolute;inset:0;opacity:.14;z-index:-1;background-image:radial-gradient(circle,white 0 1px,transparent 1.4px);background-size:7px 7px;mask-image:linear-gradient(to bottom,black,transparent 58%)}.brand{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:8px;width:100%;padding:0;border:0;color:inherit;text-align:left;background:none}.brand-mark{display:grid;place-items:center;width:48px;height:48px;color:var(--acid);background:#050607;border:4px solid var(--acid);box-shadow:4px 4px 0 var(--blue);font:1000 31px/1 var(--mono);letter-spacing:-.12em;transform:rotate(-1deg)}.brand-words{display:flex;flex-direction:column;line-height:.92;transform:rotate(-1deg)}.brand-words b,.brand-words em{font:1000 18px var(--pixel);letter-spacing:0}.brand-words em{margin-top:4px;color:var(--acid);font-style:normal}.page-nav{display:flex;flex-direction:column;gap:12px;margin-top:62px}.nav-cut{position:relative;display:grid;grid-template-columns:31px 1fr;grid-template-rows:auto auto;column-gap:7px;width:100%;min-height:66px;padding:12px 8px 10px 9px;overflow:visible;border:0;color:rgba(245,239,223,.64);text-align:left;background:transparent;transition:.16s ease}.nav-cut::before{content:'';position:absolute;inset:2px 0;z-index:-1;background:rgba(255,255,255,.06);clip-path:polygon(4% 6%,96% 0,100% 87%,6% 100%,0 20%);opacity:0;transform:rotate(-1deg);transition:.16s ease}.nav-cut:hover{color:white;transform:translateX(3px)}.nav-cut:hover::before{opacity:1}.nav-cut.active{color:var(--ink);transform:translateX(7px) rotate(-1deg)}.nav-cut.active::before{inset:     .main-stage{min-width:0;height:100%;overflow:hidden;background:color-mix(in srgb,var(--panel-solid) 88%,transparent)}.top-strip{display:flex;align-items:center;justify-content:space-between;height:var(--top-height);padding:18px 24px 12px 28px;border-bottom:1px solid var(--line);background:rgba(8,10,13,.82);backdrop-filter:blur(16px)}.page-identity{display:flex;align-items:baseline;gap:14px}.page-identity span{color:var(--acid);font:1000 9px var(--mono);letter-spacing:.14em}.page-identity h1{margin:0;font:1000 18px var(--display);letter-spacing:-.04em}.top-actions{display:flex;align-items:center;gap:9px}.service-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);font:750 9px var(--mono);background:color-mix(in srgb,var(--panel-solid) 78%,transparent)}.service-pill i{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}.icon-tool{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);color:inherit;background:transparent;font:900 14px var(--mono)}
    .page{display:none;height:calc(100% - var(--top-height));overflow:auto}.page.active{display:flex}.page::-webkit-scrollbar{width:8px}.page::-webkit-scrollbar-thumb{background:var(--blue)}.page-experts{position:relative;display:flex;flex-direction:column;padding:clamp(28px,4vw,54px);background:linear-gradient(135deg,rgba(36,57,255,.94) 0 36%,rgba(9,11,15,.92) 36.2% 100%);isolation:isolate}.page-experts::before{content:'';position:fixed;top:var(--top-height);right:0;bottom:0;left:var(--rail-width);z-index:-1;background-image:linear-gradient(rgba(9,11,15,.7),rgba(9,11,15,.92)),url('../../ui-knowledge/src/client/assets/punk-collage-dark.png');background-position:center;background-size:cover;filter:saturate(.86) contrast(1.01);opacity:.28;mix-blend-mode:normal;pointer-events:none}.section-kicker{margin:0 0 12px;color:var(--cyan);font:1000 12px var(--mono);letter-spacing:.18em}.collection-hero{display:flex;align-items:end;justify-content:space-between;gap:40px}.collection-hero h2{margin:0;font:1000 clamp(40px,5vw,60px)/.98 var(--pixel);letter-spacing:0}.collection-hero>div>p:last-child{max-width:580px;color:rgba(255,255,255,.74);font-size:16px;line-height:1.7}.expert-hero h2 span{color:var(--acid);text-shadow:4px 3px 0 var(--pink)}.giant-add{display:grid;place-items:center;flex:0 0 146px;height:120px;border:4px solid var(--ink);border-radius:16px;color:var(--ink);background:var(--acid);box-shadow:10px 10px 0 var(--pink);font:1000 40px var(--mono);transform:rotate(2deg)}.giant-add span{font:1000 13px var(--display)}.giant-add:hover{transform:translate(4px,4px) rotate(-1deg);box-shadow:5px 5px 0 var(--pink)}.collection-toolbar{display:flex;align-items:center;gap:20px;margin:32px 0 22px}.search-cut{display:flex;align-items:center;gap:9px;flex:1;max-width:520px;padding:12px 14px;border:2px solid currentColor;border-radius:12px;color:var(--paper);background:rgba(7,9,13,.75);box-shadow:5px 5px 0 rgba(36,57,255,.55)}.search-cut span{color:var(--blue);font:1000 19px var(--mono)}.search-cut input{flex:1;min-width:0;border:0;outline:0;color:inherit;background:transparent;font-size:15px}.search-cut input::placeholder{color:var(--muted)}.collection-toolbar>span{color:rgba(255,255,255,.68);font:900 12px var(--mono)}.expert-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:16px;padding-bottom:40px}.record-card{position:relative;min-height:260px;padding:20px;overflow:hidden;border:3px solid var(--ink);border-radius:14px;color:var(--ink);background:var(--paper);box-shadow:7px 7px 0 var(--ink)}.record-card:nth-child(3n+2){background:var(--acid);transform:rotate(.7deg)}.record-card:nth-child(3n+3){color:var(--paper);background:var(--pink);transform:rotate(-.65deg)}.record-card::after{content:attr(data-index);position:absolute;right:6px;bottom:-19px;opacity:.09;font:1000 84px var(--mono)}.record-card.disabled{filter:grayscale(1);opacity:.57}.record-top{display:flex;align-items:center;justify-content:space-between}.record-avatar{display:grid;place-items:center;width:52px;height:52px;border:3px solid currentColor;border-radius:12px;background:var(--yellow);box-shadow:4px 4px 0 var(--blue);font:1000 25px var(--mono);transform:rotate(-3deg)}.record-card:nth-child(3n+3) .record-avatar{color:var(--ink);background:var(--cyan)}.record-status{padding:4px 7px;border:2px solid currentColor;border-radius:6px;font:900 10px var(--mono)}.record-card h3{margin:24px 0 7px;font:1000 24px var(--display);letter-spacing:-.05em}.record-card p{min-height:46px;margin:0;opacity:.72;font-size:14px;line-height:1.55}.record-actions{position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}.record-actions button{padding:7px 9px;border:2px solid currentColor;border-radius:8px;color:inherit;background:transparent;font:900 11px var(--mono)}.record-actions .call{color:var(--paper);background:var(--ink)}.record-card:nth-child(3n+3) .record-actions .call{color:var(--ink);background:var(--acid)}.record-actions button:hover{color:var(--ink);background:var(--cyan)}.empty-records{grid-column:1/-1;padding:70px 30px;border:3px dashed rgba(255,255,255,.38);border-radius:14px;color:rgba(255,255,255,.68);text-align:center}.empty-records strong{display:block;margin-bottom:8px;color:white;font:1000 25px var(--display)}
    dialog{color:var(--text)}dialog::backdrop{background:rgba(3,4,7,.74);backdrop-filter:blur(8px)}.boujoy-dialog{width:min(650px,calc(100vw - 50px));padding:0;border:3px solid var(--acid);background:var(--panel-solid);box-shadow:12px 12px 0 var(--blue)}.boujoy-dialog form{padding:24px}.boujoy-dialog header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding-bottom:17px;border-bottom:1px solid var(--line)}.boujoy-dialog header p{margin:0 0 5px;color:var(--acid);font:900 10px var(--mono);letter-spacing:.13em}.boujoy-dialog header h2{margin:0;font:1000 28px var(--display)}.dialog-close{width:34px;height:34px;border:2px solid currentColor;color:inherit;background:transparent;font:1000 20px var(--mono)}.dialog-close:hover{color:var(--ink);background:var(--pink)}.boujoy-dialog label{display:block;margin-top:16px;color:var(--muted);font:800 11px var(--mono)}.boujoy-dialog input:not([type=checkbox]),.boujoy-dialog textarea,.boujoy-dialog select{width:100%;margin-top:7px;padding:11px 12px;resize:vertical;border:1px solid var(--line);color:var(--text);background:rgba(255,255,255,.045);font:500 14px var(--read);line-height:1.6}.check-row{display:flex!important;align-items:center;gap:8px}.check-row input{accent-color:var(--acid)}.boujoy-dialog footer{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;padding-top:17px;border-top:1px solid var(--line)}.boujoy-dialog footer button{padding:10px 16px}.ghost-button,.primary-cut{border:2px solid currentColor;font:900 13px var(--display)}.ghost-button{color:inherit;background:transparent}.primary-cut{color:var(--ink);background:var(--acid);box-shadow:4px 4px 0 var(--blue)}.dispatch-badge{margin:16px 0 0;padding:13px;color:var(--ink);background:var(--yellow);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--pink);font:900 13px var(--display)}.hidden{display:none!important}.mockup-note{position:fixed;right:18px;bottom:14px;z-index:20;color:rgba(245,239,223,.62);font:800 8px var(--mono);letter-spacing:.08em}
    @media(max-width:1180px){.expert-grid{grid-template-columns:repeat(2,minmax(220px,1fr))}}@media(max-width:760px){html,body{overflow:auto}.product-shell{display:block;height:auto}.global-rail{display:none}.main-stage{height:auto;min-height:100vh}.top-strip{height:62px;padding:12px 16px}.page{height:auto;min-height:calc(100vh - 62px)}.page-experts{padding:28px 16px 40px}.collection-hero{align-items:flex-start;flex-direction:column;gap:26px}.collection-hero h2{font-size:36px}.giant-add{align-self:flex-end}.collection-toolbar{align-items:stretch;flex-wrap:wrap;margin-top:28px}.search-cut{flex:1 1 100%;max-width:none}.expert-grid{grid-template-columns:1fr}.record-card{min-height:240px}.service-pill{display:none}.page-identity h1{font-size:16px}.boujoy-dialog{width:100%;max-width:100%;height:90vh;max-height:90vh;margin:0;position:fixed;right:0;bottom:0;left:0;top:auto;border-radius:14px 14px 0 0}}
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true"><div class="scene-texture"></div><div class="scene-shard shard-a"></div><div class="scene-shard shard-b"></div><div class="scene-scribble">// BUILD YOUR OWN RULES //</div></div>
  <div class="product-shell">
    <aside class="global-rail" aria-label="主要导航"><button class="brand" type="button"><span class="brand-mark" aria-hidden="true">B</span><span class="brand-words"><b>DEEPSEEK</b><em>HARNESS</em></span></button><nav class="page-nav"><button class="nav-cut" type="button"><span class="nav-number">01</span><strong>AGENT</strong><small>执行现场</small></button><button class="nav-cut" type="button"><span class="nav-number">02</span><strong>知识库</strong><small>第二大脑</small></button><button class="nav-cut active" type="button"><span class="nav-number">03</span><strong>专家</strong><small>调用阵容</small></button><button class="nav-cut" type="button"><span class="nav-number">04</span><strong>风格</strong><small>输出声线</small></button><button class="nav-cut" type="button"><span class="nav-number">05</span><strong>监控</strong><small>用量与轨迹</small></button><button class="nav-cut" type="button"><span class="nav-number">06</span><strong>新闻</strong><small>AI 动态与工具</small></button></nav><div class="rail-footer"><button class="mode-switch" type="button"><span class="mode-led"></span><span><b>知识模式</b><small>VAULT 已连接</small></span></button><button class="rail-tool" type="button"><span>⚙</span>设置</button></div></aside>
    <main class="main-stage"><header class="top-strip"><div class="page-identity"><span>ROSTER / 03</span><h1>专家 调用阵容</h1></div><div class="top-actions"><span class="service-pill"><i></i>本地引擎已连接</span><button class="icon-tool" type="button" aria-label="命令面板">⌘</button><button class="icon-tool" type="button" aria-label="切换主题">◐</button></div></header>
      <section class="page page-experts active" aria-labelledby="experts-title"><div class="collection-hero expert-hero"><div><p class="section-kicker">CALL THE RIGHT BRAIN</p><h2 id="experts-title">专家不是头像，<br><span>是可调用的方法。</span></h2><p>创建、组合并直接派发到 Agent。所有配置保存在本地 Markdown。</p></div><button id="addExpertButton" class="giant-add" type="button">＋<span>新增专家</span></button></div><div class="collection-toolbar"><label class="search-cut"><span>⌕</span><input id="expertSearch" placeholder="搜索专家…" aria-label="搜索专家"></label><span id="expertCount">3 位专家</span></div><div id="expertGrid" class="expert-grid"></div></section>
    </main>
  </div>
  <p class="mockup-note">BOUJOY SOURCE-FIDELITY MOCKUP · UI ONLY</p>
  <dialog id="recordDialog" class="boujoy-dialog"><form method="dialog" id="recordForm"><header><div><p id="recordKicker">NEW RECORD</p><h2 id="recordDialogTitle">新增专家</h2></div><button type="button" class="dialog-close" data-close-dialog="recordDialog" aria-label="关闭">×</button></header><input id="recordId" type="hidden"><input id="recordKind" type="hidden" value="expert"><label>名称<input id="recordName" required maxlength="80" placeholder="例如：产品战略专家"></label><label>一句话说明<input id="recordDescription" maxlength="180" placeholder="擅长什么，什么时候调用"></label><label>系统指令<textarea id="recordInstructions" required rows="10" placeholder="写下角色、判断标准、工作流程和输出要求…"></textarea></label><label class="check-row"><input id="recordEnabled" type="checkbox" checked><span>启用这个配置</span></label><footer><button type="button" class="ghost-button" data-close-dialog="recordDialog">取消</button><button type="submit" class="primary-cut">保存到 Markdown</button></footer></form></dialog>
  <dialog id="dispatchDialog" class="boujoy-dialog"><form method="dialog" id="dispatchForm"><header><div><p>DISPATCH TO AGENT</p><h2>调用专家</h2></div><button type="button" class="dialog-close" data-close-dialog="dispatchDialog" aria-label="关闭">×</button></header><div id="dispatchBadge" class="dispatch-badge"></div><label>叠加输出风格<select><option>不叠加风格</option><option>简洁清晰</option><option>深度分析</option></select></label><label>本次任务<textarea required rows="7" placeholder="告诉它这次要解决什么…"></textarea></label><footer><button type="button" class="ghost-button" data-close-dialog="dispatchDialog">取消</button><button type="submit" class="primary-cut">送进 Agent →</button></footer></form></dialog>
  <script>
    const experts=[{id:'strategy',name:'产品战略专家',description:'把模糊方向收敛为可交付的决定、优先级与最小下一步。',instructions:'先明确目标、约束和成功标准，再给出可执行方案。',enabled:true},{id:'research',name:'研究与证据专家',description:'拆解开放问题，寻找可验证的线索、来源和行动路径。',instructions:'区分事实、推断和待验证假设，保留来源与不确定性。',enabled:true},{id:'review',name:'代码审查专家',description:'沿着真实调用路径检查实现、测试、边界条件与风险。',instructions:'先复现调用链，再按严重程度说明问题、证据和最小修复。',enabled:true},{id:'editor',name:'表达编辑专家',description:'把复杂内容整理成清晰、有节奏、可直接使用的表达。',instructions:'保留原意，删掉空话，让结构和下一步一眼可见。',enabled:false}];
    let query='';const grid=document.querySelector('#expertGrid');const count=document.querySelector('#expertCount');const recordDialog=document.querySelector('#recordDialog');const dispatchDialog=document.querySelector('#dispatchDialog');const visible=()=>experts.filter(item=>`${item.name} ${item.description}`.toLocaleLowerCase().includes(query.trim().toLocaleLowerCase()));
    function render(){const rows=visible();count.textContent=`${rows.length} 位专家`;grid.innerHTML=rows.length?rows.map((item,index)=>`<article class="record-card ${item.enabled?'':'disabled'}" data-index="${String(index+1).padStart(2,'0')}" data-id="${item.id}"><div class="record-top"><span class="record-avatar">${item.name.slice(0,1)}</span><span class="record-status">${item.enabled?'ON CALL':'OFF'}</span></div><h3>${item.name}</h3><p>${item.description}</p><div class="record-actions"><button class="call" type="button" data-record-call="${item.id}">调用专家 →</button><button type="button" data-record-edit="${item.id}">编辑</button><button type="button" data-record-copy="${item.id}">复制</button><button type="button" data-record-delete="${item.id}">删除</button></div></article>`).join(''):'<div class="empty-records"><strong>专家阵容还是空的</strong><p>点击右上角新增，配置会保存为本地 Markdown。</p></div>'}
    function openRecord(item=null,copy=false){document.querySelector('#recordKicker').textContent=item&&!copy?'EDIT RECORD':'NEW RECORD';document.querySelector('#recordDialogTitle').textContent=`${item&&!copy?'编辑':'新增'}专家`;document.querySelector('#recordName').value=item?`${item.name}${copy?' 副本':''}`:'';document.querySelector('#recordDescription').value=item?.description||'';document.querySelector('#recordInstructions').value=item?.instructions||'';recordDialog.showModal()}
    document.querySelector('#expertSearch').addEventListener('input',event=>{query=event.target.value;render()});document.querySelector('#addExpertButton').addEventListener('click',()=>openRecord());document.querySelector('#recordForm').addEventListener('submit',event=>{event.preventDefault();recordDialog.close()});document.querySelector('#dispatchForm').addEventListener('submit',event=>{event.preventDefault();dispatchDialog.close()});document.querySelectorAll('[data-close-dialog]').forEach(button=>button.addEventListener('click',()=>document.getElementById(button.dataset.closeDialog).close()));grid.addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;const item=experts.find(row=>row.id===button.dataset.recordCall||row.id===button.dataset.recordEdit||row.id===button.dataset.recordCopy);if(button.dataset.recordCall){document.querySelector('#dispatchBadge').textContent=item.name;dispatchDialog.showModal()}else if(button.dataset.recordEdit){openRecord(item)}else if(button.dataset.recordCopy){openRecord(item,true)}});render();
  </script>
</body>
</html>
